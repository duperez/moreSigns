buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = "${mc_version}-${mod_version}"
group = 'duperez.moresigns'
archivesBaseName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Minecraft 1.18.2 ships LWJGL 3.2.1, whose macOS natives are Intel-only, so the dev client cannot start on Apple Silicon.
// On an ARM Mac, use the LWJGL 3.3 the later versions use, with its ARM natives unpacked into a folder LWJGL is pointed at.
// Other machines are left alone.
def appleSilicon = System.getProperty('os.name').toLowerCase().contains('mac') && System.getProperty('os.arch') == 'aarch64'
def armNativesDir = layout.buildDirectory.dir('natives-arm64')
configurations {
    armNatives
}
if (appleSilicon) {
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.lwjgl') {
                details.useVersion '3.3.1'
            }
        }
    }
}

minecraft {
    mappings channel: 'official', version: mc_version

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id
            if (appleSilicon) {
                property 'org.lwjgl.librarypath', armNativesDir.get().asFile.absolutePath
            }
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.test // the game tests live here so they do not ship in the jar
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.test
                }
            }
        }

        gameTestServer {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.test
                }
            }
        }

        data {
            workingDirectory project.file('run-data')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

// Datagen output is committed, so it is part of the jar like any other resource.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"

    if (appleSilicon) {
        ['lwjgl', 'lwjgl-glfw', 'lwjgl-jemalloc', 'lwjgl-openal', 'lwjgl-opengl', 'lwjgl-stb', 'lwjgl-tinyfd'].each {
            armNatives "org.lwjgl:${it}:3.3.1:natives-macos-arm64"
        }
    }

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.register('extractArmNatives', Copy) {
    from { configurations.armNatives.collect { zipTree(it) } }
    include '**/*.dylib'
    eachFile { path = name } // flat, as LWJGL looks for them
    includeEmptyDirs = false
    into armNativesDir
}

if (appleSilicon) {
    tasks.configureEach { task ->
        if (task.name == 'runClient') {
            task.dependsOn 'extractArmNatives'
        }
    }
}

processResources {
    exclude '.cache' // datagen's incremental cache, not a resource
    def replaceProperties = [
            mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
            mod_authors: mod_authors, mod_license: mod_license, mod_description: mod_description,
            minecraft_version_range: mc_version_range, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
